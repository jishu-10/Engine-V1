services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: similarity
      POSTGRES_USER: similarity
      POSTGRES_PASSWORD: similarity
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U similarity -d similarity"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env.example
    environment:
      DATABASE_URL: postgresql+psycopg://similarity:similarity@postgres:5432/similarity
    ports:
      - "8000:8000"

volumes:
  postgres_data:

